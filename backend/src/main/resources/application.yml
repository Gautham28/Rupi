server:
  port: ${PORT:8090}
  max-http-request-header-size: 64KB

spring:
  application:
    name: rupi-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/rupi}
    username: ${DATABASE_USERNAME:rupi}
    password: ${DATABASE_PASSWORD:rupi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

rupi:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-use-at-least-32-chars!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${DEMO_MODE:true}
    signup-credits: 1000.00
    faucet-amount: 500.00
    faucet-cooldown-hours: 24
    max-balance: 5000.00
