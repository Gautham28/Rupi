services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rupi
      POSTGRES_USER: rupi
      POSTGRES_PASSWORD: rupi
    ports:
      - "5433:5432"
    volumes:
      - rupi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupi -d rupi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rupi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rupi_pg:
  rupi_redis:
